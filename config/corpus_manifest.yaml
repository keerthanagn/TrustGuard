# Reproducible batch-import manifest for Indian central legislation.
# Consumed by scripts/import_corpus.py, which reuses retrieval.kb_manager.KnowledgeBase.ingest
# (dedup by SHA-256, statute-aware chunking, scanned-PDF detection, provenance schema).
#
# Rules honoured by the importer:
#   - idempotent: an Act already indexed (same title) is skipped; failed ones stay retryable.
#   - imported documents enter as status=unreviewed (provenance recorded, not yet human-verified).
#   - each entry lists official source URLs in priority order; the importer tries them in turn and
#     verifies the %PDF- header. No unofficial mirror is used as a primary source.
#   - nothing here is marked current/verified automatically.

documents:
  - act_code: BNSS
    title: "Bharatiya Nagarik Suraksha Sanhita, 2023 (Act 46 of 2023)"
    ref_type: Section
    effective_date: "2024-07-01"
    version: "Act 46 of 2023; in force 1 Jul 2024 (replaces CrPC 1973)"
    sources:
      - "https://egazette.gov.in/WriteReadData/2023/250884.pdf"
      - "https://www.mha.gov.in/sites/default/files/2024-04/250884_2_english_01042024.pdf"
    notes: "Official Gazette / MHA English text of the BNSS, 2023."

