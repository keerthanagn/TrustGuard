# TrustGuard default configuration.
# Any value can be overridden by an environment variable named TRUSTGUARD_<SECTION>_<KEY>
# (e.g. TRUSTGUARD_LLM_MODEL=llama3.2:3b) or by settings passed at runtime from the UI/API.

llm:
  provider: ollama             # ollama | openai  (openai = any OpenAI-compatible endpoint)
  base_url: http://localhost:11434
  openai_base_url: http://localhost:8000/v1   # used when provider=openai (vLLM/LM Studio/llama.cpp/OpenRouter/OpenAI)
  api_key_env: OPENAI_API_KEY  # env var name holding the key (never hardcode keys)
  model: qwen2.5:3b            # any locally pulled Ollama model, or a model id for the OpenAI endpoint
  temperature: 0.1
  max_tokens: 450
  connect_timeout_s: 5
  read_timeout_s: 240
  technical_retries: 1         # re-sends on connection errors (separate from repair retries)

retrieval:
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  use_reranker: true
  use_semantic: true           # false -> lexical (BM25) only, for very limited hardware
  top_k: 6                     # passages given to the LLM
  candidate_k: 30              # candidates per retriever before fusion
  rrf_k: 60
  chunk_chars: 1200
  chunk_overlap: 150
  include_outdated: false      # outdated documents are kept for audit but excluded from evidence
  min_relevance: 0.35          # minimum normalised relevance for a passage to count as evidence

verification:
  nli_model: cross-encoder/nli-deberta-v3-xsmall
  entail_threshold: 0.55
  contradict_threshold: 0.80
  min_lexical_coverage: 0.30
  claim_top_k: 5
  max_claims: 12
  nli_batch_size: 16
  structured_claims: false     # true -> LLM decomposes its answer into JSON claims (self-citations are
                               # re-verified independently, never trusted). Default off keeps claim
                               # extraction independent of the generating model.

safety:
  block_threshold: 0.80        # classifier probability for BLOCK without a rule hit
  review_threshold: 0.50
  rule_block_score: 0.70       # aggregate rule score that triggers BLOCK when intent is operational
  withhold_on_review: true     # strict mode: answers flagged REVIEW are not released

middleware:
  max_retries: 2               # repair attempts after the initial generation
  require_citations: true
  min_material_claims: 1

privacy:
  log_queries: true            # false -> store only a SHA-256 hash of the question, redact drafts
  store_withheld_drafts: true  # drafts are visible only in the admin audit view, never as an answer
  retention_days: 0            # 0 = keep audit records indefinitely; N>0 = purge records older than N days

security:
  # Lightweight access control for a research prototype. Set TRUSTGUARD_ADMIN_TOKEN in the environment to
  # gate admin surfaces (Knowledge Base management, full audit drafts). Empty token = single-user mode
  # (admin surfaces open locally). This is NOT a substitute for real auth in a multi-user deployment.
  require_admin_token: false   # true -> admin surfaces require the token even locally

paths:
  data_dir: data
  db_path: data/trustguard.db
  pdf_dir: data/legal_pdfs
  kb_dir: data/kb
  reports_dir: reports
  safety_train: data/safety/safety_train.jsonl
  legal_currency: config/legal_currency.yaml

limits:
  max_question_chars: 2000
  max_upload_mb: 60
  max_pdf_pages: 2500
