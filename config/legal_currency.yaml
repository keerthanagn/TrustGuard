# Legal-currency registry: provisions whose text may still appear in documents but which are
# no longer good law. Every entry must carry a verifiable authority. Entries are curator-entered
# and shown as such in reports; they are never generated by the LLM.

entries:
  - act: ITA
    section: "66A"
    status: struck_down
    effective: "2015-03-24"
    note: >-
      Section 66A of the Information Technology Act, 2000 was declared unconstitutional and
      struck down in its entirety by the Supreme Court of India.
    authority: "Shreya Singhal v. Union of India, (2015) 5 SCC 1"
    curator_verified: true

  - act: IPC
    section: "*"
    status: repealed
    effective: "2024-07-01"
    note: >-
      The Indian Penal Code, 1860 is repealed by section 358 of the Bharatiya Nyaya Sanhita,
      2023, which came into force on 1 July 2024. Offences committed on or after that date are
      governed by the BNS.
    authority: "Bharatiya Nyaya Sanhita, 2023, s. 358; MHA notification S.O. 850(E), 23 Feb 2024"
    curator_verified: true
